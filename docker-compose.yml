name: ai-customer-support

services:
  backend:
    image: ${DOCKERHUB_USERNAME:-local}/ai-customer-support-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:////data/tickets.db
      KNOWLEDGE_BASE_DIR: /data/knowledge_base
    ports:
      - "8000:8000"
    volumes:
      - ticket_data:/data
      - chroma_data:/app/app/chroma_db
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/ai-customer-support-frontend:latest
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ticket_data:
  chroma_data:
